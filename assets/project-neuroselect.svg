<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="288" viewBox="0 0 1000 288" role="img" aria-labelledby="t d"><title id="t">neuroselect: project panel</title><desc id="d">neuroselect. Reproducible groundwork for non-invasive brain-to-text decoding: a character-level CTC baseline on public MEG data. Audits come first. 306 MEG channels (public SpanishBCBL). 8 real trials (extracted, audited). 50 Hz processed rate (from 1000 Hz MEG). Built with Python, PyTorch, MNE, NumPy, SciPy, pytest.</desc><style>.rv{animation:rv .7s ease-out backwards}@keyframes rv{from{opacity:0;transform:translateY(8px)}}.tr{animation:tr 7s linear infinite}@keyframes tr{to{transform:translateX(-240px)}}.hl{animation:hl 4.2s steps(6,end) infinite}@keyframes hl{to{transform:translateX(138px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="nc"><rect x="18" y="28" width="270" height="76"/></clipPath><linearGradient id="nf" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".15" stop-color="#fff"/><stop offset=".85" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="nm"><rect x="18" y="28" width="270" height="76" fill="url(#nf)"/></mask></defs><rect width="1000" height="288" rx="10" fill="#0d1117"/><g font-family="ui-monospace,SFMono-Regular,'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace"><rect x="0.5" y="0.5" width="999" height="287" rx="8" fill="none" stroke="#30363d"/><path d="M1 28.5H999" stroke="#21262d"/><circle cx="16" cy="14" r="4" fill="#30363d"/><circle cx="30" cy="14" r="4" fill="#30363d"/><circle cx="44" cy="14" r="4" fill="#30363d"/><text x="64" y="18" font-size="10.5" letter-spacing=".6" fill="#6e7681">~/projects/neuroselect</text><text x="986" y="18" text-anchor="end" font-size="10.5" fill="#6e7681">github.com/Pranav-0710/neuroselect</text><g class="rv" style="animation-delay:0.10s"><rect x="24.5" y="50.5" width