<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="288" viewBox="0 0 1000 288" role="img" aria-labelledby="t d"><title id="t">dhwani-desk: project panel</title><desc id="d">dhwani-desk. A Kannada voice helpline for civic complaints that hands danger to a person first. Every decision runs locally on a CPU. 30/34 hazards caught (held-out test calls). 0.71 department F1 (macro, up from 0.13). 1.5 s first reply (approximate latency). Built with Python, FastAPI, React, TypeScript, Laya.</desc><style>.rv{animation:rv .7s ease-out backwards}@keyframes rv{from{opacity:0;transform:translateY(8px)}}.b{transform-box:fill-box;transform-origin:center;animation:eq 1s ease-in-out infinite alternate}@keyframes eq{from{transform:scaleY(.2)}}.n{opacity:0;animation:n 4.5s linear infinite}@keyframes n{0%,30%{opacity:1}34%,100%{opacity:0}}.n2{animation-delay:1.5s}.n3{animation-delay:3s}.pd{transform:translateX(458px);animation:pd 4.5s linear infinite}@keyframes pd{from{transform:translateX(28px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs></defs><rect width="1000" height="288" rx="10" fill="#0d1117"/><g font-family="ui-monospace,SFMono-Regular,'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace"><rect x="0.5" y="0.5" width="999" height="287" rx="8" fill="none" stroke="#30363d"/><path d="M1 28.5H999" stroke="#21262d"/><circle cx="16" cy="14" r="4" fill="#30363d"/><circle cx="30" cy="14" r="4" fill="#30363d"/><circle cx="44" cy="14" r="4" fill="#30363d"/><text x="64" y="18" font-size="10.5" letter-spacing=".6" fill="#6e7681">~/projects/dhwani-desk</text><text x="986" y="18" text-anchor="end" font-size="10.5" fill="#6e7681">github.com/Pranav-0710/dhwani-desk</text><g class="rv" style="animation-delay:0.10s"><rect x="24.5" y="50.5" width="334.8" height="21" rx="10.5" fill="#161b22" stroke="#30363d"/><circle cx="37" cy="61" r="3" fill="#39d353"/><text x="48" y="65" font-size="11" fill="#8b949e">Gnani AI · Great Indian AI Internship Challenge</text></g><g class="rv" style="animation-delay:0.20s"><rect x="24" y="85.0" width="3" height="26.6" rx="1.5" fill="#39d353"/><text x="38" y="108" font-size="28" font-weight="700" fill="#c9d1d9">dhwani-desk</text></g><g class="rv" style="animation-delay:0.30s"><g font-size="14" fill="#8b949e"><text x="24" y="140">A Kannada voice helpline for civic complaints that</text><text x="24" y="161">hands danger to a person first. Every decision</text><text x="24" y="182">runs locally on a CPU.</text></g></g><g class="rv" style="animation-delay:0.15s"><g transform="translate(496,52) scale(1)"><rect x=".5" y=".5" width="479" height="119" rx="8" fill="#0d1117" stroke="#21262d"/><text x="18" y="21" font-size="10.5" letter-spacing=".4" fill="#6e7681">voice in · local decision · voice out</text><rect class="b" style="animation-delay:-0.95s;animation-duration:0.98s" x="28" y="45.0" width="5" height="34" rx="2.5" fill="#26a641"/><rect class="b" style="animation-delay:-0.07s;animation-duration:1.08s" x="37" y="53.5" width="5" height="17" rx="2.5" fill="#39d353"/><rect class="b" style="animation-delay:-0.58s;animation-duration:1.34s" x="46" y="43.5" width="5" height="37" rx="2.5" fill="#39d353"/><rect class="b" style="animation-delay:-0.04s;animation-duration:1.00s" x="55" y="48.5" width="5" height="27" rx="2.5" fill="#26a641"/><rect class="b" style="animation-delay:-0.24s;animation-duration:1.09s" x="64" y="53.0" width="5" height="18" rx="2.5" fill="#39d353"/><rect class="b" style="animation-delay:-0.83s;animation-duration:0.79s" x="73" y="53.5" width="5" height="17" rx="2.5" fill="#39d353"/><rect class="b" style="animation-delay:-0.63s;animation-duration:1.11s" x="82" y="48.0" width="5" height="28" rx="2.5" fill="#26a641"/><rect class="b" style="animation-delay:-0.58s;animation-duration:0.98s" x="91" y="53.5" width="5" height="17" rx="2.5" fill="#39d353"/><rect class="b" style="animation-delay:-0.05s;animation-duration:1.30s" x="100" y="48.0" width="5"