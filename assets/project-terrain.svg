<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="288" viewBox="0 0 1000 288" role="img" aria-labelledby="t d"><title id="t">Terrain: project panel</title><desc id="d">Terrain. News intelligence on a 3D WebGL globe: compare how outlets around the world frame the same event, with LLM consensus and contradiction analysis. 3D WebGL globe (live events on a map). GDELT + RSS ingestion (geocoded news). 30-day scenario sim (red-team mode). Built with Next.js, React, Three.js, FastAPI, Supabase, PostGIS.</desc><style>.rv{animation:rv .7s ease-out backwards}@keyframes rv{from{opacity:0;transform:translateY(8px)}}.m{transform-box:fill-box;transform-origin:center;animation:m 6s ease-in-out infinite}@keyframes m{0%,100%{transform:scaleX(1)}50%{transform:scaleX(0)}}.e{transform-box:fill-box;transform-origin:center;animation:e 2.2s ease-out infinite}@keyframes e{from{transform:scale(1);opacity:.8}to{transform:scale(4);opacity:0}}.a{fill:none;stroke-dasharray:1;animation:a 8s linear infinite}.a0{animation-name:a0}@keyframes a0{0%,8%{stroke-dashoffset:1}20%,90%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}.t0{animation:t0 8s linear infinite}@keyframes t0{0%,20%{opacity:0}24%,90%{opacity:1}96%,100%{opacity:0}}.a1{animation-name:a1}@keyframes a1{0%,30%{stroke-dashoffset:1}42%,90%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}.t1{animation:t1 8s linear infinite}@keyframes t1{0%,42%{opacity:0}46%,90%{opacity:1}96%,100%{opacity:0}}.a2{animation-name:a2}@keyframes a2{0%,52%{stroke-dashoffset:1}64%,90%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}.t2{animation:t2 8s linear infinite}@keyframes t2{0%,64%{opacity:0}68%,90%{opacity:1}96%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs></defs><rect width="1000" height="288" rx="10" fill="#0d1117"/><g font-family="ui-monospace,SFMono-Regular,'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,'Liberation Mo