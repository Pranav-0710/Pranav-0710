<svg xmlns="http://www.w3.org/2000/svg" width="480" height="392" viewBox="0 0 480 392" role="img" aria-labelledby="t d"><title id="t">Jey Pranav: ml / ai engineering</title><desc id="d">ML / AI engineering. I build software where models meet real users: voice AI, LLM agents, RL environments, 3D data products and brain-to-text research. Open to internships and collaborations.</desc><style>.cv{transform:translateX(124.8px);animation:ty 0.78s steps(13,end) 0.2s backwards}@keyframes ty{from{transform:translateX(0)}}.cur{animation:bl 1.1s steps(1,end) infinite}@keyframes bl{50%{opacity:0}}.in{animation:in .7s ease-out backwards}@keyframes in{from{opacity:0;transform:translateY(8px)}}.f{opacity:0;animation:fl .09s linear}@keyframes fl{from,to{opacity:1}}.nm{animation:on .01s linear 1.46s backwards}@keyframes on{from{opacity:0}}.glow{animation:gl 16s ease-in-out infinite alternate}@keyframes gl{to{transform:translate(216px,40px)}}.scan{animation:sc 9s linear infinite}@keyframes sc{0%{transform:translateY(0);opacity:.5}30%{transform:translateY(312px);opacity:.5}31%,100%{transform:translateY(312px);opacity:0}}.ping{transform-box:fill-box;transform-origin:center;animation:pg 2.4s ease-out infinite}@keyframes pg{from{transform:scale(1);opacity:.7}to{transform:scale(3.4);opacity:0}}.f0{animation-delay:1.10s}.f1{animation-delay:1.19s}.f2{animation-delay:1.28s}.f3{animation-delay:1.37s}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><radialGradient id="gl"><stop offset="0" stop-color="#39d353" stop-opacity=".2"/><stop offset="1" stop-color="#39d353" stop-opacity="0"/></radialGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r=".9" fill="#30363d"/></pattern><linearGradient id="fadeR" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/></linearGradient><mask id="dm"><rect width="480" height="392" fill="url(#fadeR)"/></mask><cli