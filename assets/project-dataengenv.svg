<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="308" viewBox="0 0 1000 308" role="img" aria-labelledby="t d"><title id="t">DataEngEnv: project panel</title><desc id="d">DataEngEnv. PipelineOps Arena: a 4-stage environment where an LLM agent repairs a broken ML pipeline. Rewards come from running the fixed code, not from an LLM judge. 4 cascading stages (schema → fairness). 0.25→0.38 avg reward (25-step GRPO run). live Hugging Face (Space you can try). Built with Python, FastAPI, Docker, OpenEnv, Unsloth, LoRA, GRPO.</desc><style>.rv{animation:rv .7s ease-out backwards}@keyframes rv{from{opacity:0;transform:translateY(8px)}}.s0{animation:s0 10s linear infinite}@keyframes s0{0%,15%{opacity:0}18%,94%{opacity:1}100%{opacity:0}}.s1{animation:s1 10s linear infinite}@keyframes s1{0%,35%{opacity:0}38%,94%{opacity:1}100%{opacity:0}}.s2{animation:s2 10s linear infinite}@keyframes s2{0%,55%{opacity:0}58%,94%{opacity:1}100%{opacity:0}}.s3{animation:s3 10s linear infinite}@keyframes s3{0%,75%{opacity:0}78%,94%{opacity:1}100%{opacity:0}}.rw{transform-box:fill-box;transform-origin:left center;animation:rw 10s ease-in-out infinite}@keyframes rw{0%,15%{transform:scaleX(0)}18%,35%{transform:scaleX(.25)}38%,55%{transform:scaleX(.5)}58%,75%{transform:scaleX(.75)}78%,94%{transform:scaleX(1)}100%{transform:scaleX(0)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs></defs><rect width="1000" height="308" rx="10" fill="#0d1117"/><g font-family="ui-monospace,SFMono-Regular,'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace"><rect x="0.5" y="0.5" width="999" height="307" rx="8" fill="none" stroke="#30363d"/><path d="M1 28.5H999" stroke="#21262d"/><circle cx="16" cy="14" r="4" fill="#30363d"/><circle cx="30" cy="14" r="4" fill="#30363d"/><circle cx="44" cy="14" r="4" fill="#30363d"/><text x="64" y="18" font-size="10.5" letter-spacing=".6" fill="#6e7681">~/projects/DataEngEnv</text><text x="986" y="18" text-anchor=