<svg xmlns="http://www.w3.org/2000/svg" width="480" height="490" viewBox="0 0 480 490" role="img" aria-labelledby="t d"><title id="t">dhwani-desk: project panel</title><desc id="d">dhwani-desk. A Kannada voice helpline for civic complaints that hands danger to a person first. Every decision runs locally on a CPU. 30/34 hazards caught (held-out test calls). 0.71 department F1 (macro, up from 0.13). 1.5 s first reply (approximate latency). Built with Python, FastAPI, React, TypeScript, Laya.</desc><style>.rv{animation:rv .7s ease-out backwards}@keyframes rv{from{opacity:0;transform:translateY(8px)}}.b{transform-box:fill-box;transform-origin:center;animation:eq 1s ease-in-out infinite alternate}@keyframes eq{from{transform:scaleY(.2)}}.n{opacity:0;animation:n 4.5s linear infinite}@keyframes n{0%,30%{opacity:1}34%,100%{opacity:0}}.n2{animation-delay:1.5s}.n3{animation-delay:3s}.pd{transform:translateX(458px);animation:pd 4.5s linear infinite}@keyframes pd{from{transform:translateX(28px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs></defs><rect width="480" height="490" rx="10" fill="#0d1117"/><g font-family="ui-monospace,SFMono-Regular,'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace"><rect x="0.5" y="0.5" width="479" height="489" rx="8" fill="none" stroke="#30363d"/><path d="M1 28.5H479" stroke="#21262d"/><circle cx="16" cy="14" r="4" fill="#30363d"/><circle cx="30" cy="14" r="4" fill="#30363d"/><circle cx="44" cy="14" r="4" fill="#30363d"/><text x="64" y="18" font-size="10.5" letter-spacing=".6" fill="#6e7681">~/projects/dhwani-desk</text><g class="rv" style="animation-delay:0.10s"><rect x="16.5" y="46.5" width="334.8" height="21" rx="10.5" fill="#161b22" stroke="#30363d"/><circle cx="29" cy="57" r="3" fill="#39d353"/><text x="40" y="61" font-size="11" fill="#8b949e">Gnani AI · Great Indian AI Internship Challenge</text></g><g class="rv" style="animation-delay:0.15s"><g transform="translate(16,80